[project]
name = "salary"
version = "0.1.0"
description = "Учёт заработной платы сотрудников (гексагональная архитектура)"
authors = [
    { name = "Артем Плохотнюк", email = "aplokhotnyuk@diasoft.ru" }
]
requires-python = ">=3.14"
dependencies = [
    "bcrypt>=5.0.0",
    "fastapi>=0.142.2",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "sqlalchemy>=2.1.3",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
salary = "salary.cli:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
