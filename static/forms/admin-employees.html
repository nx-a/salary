<section class="card">
  <h2>Сотрудники</h2>
  <form id="filter-form" class="inline" style="margin-bottom:12px">
    <label>Статус
      <select name="status">
        <option value="">все</option>
        <option value="pending" selected>на проверке</option>
        <option value="active">подтверждённые</option>
        <option value="rejected">отклонённые</option>
      </select>
    </label>
  </form>
  <div class="table-wrap">
    <table>
      <thead><tr><th>ФИО</th><th>Логин</th><th>Роль</th><th>Статус</th><th class="num">Оклад</th><th>Действия</th></tr></thead>
      <tbody data-employees></tbody>
    </table>
  </div>
</section>
