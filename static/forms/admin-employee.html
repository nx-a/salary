<p><a href="#/admin/employees">← К списку сотрудников</a></p>

<section class="card">
  <h2 data-name></h2>
  <p class="muted"><span data-login></span> · <span data-status></span></p>
  <div data-verify-actions style="display:flex;gap:8px;margin-bottom:16px"></div>
  <form id="salary-form" class="inline">
    <label>Оклад, ₽ <input name="base_salary" type="number" min="0" step="0.01" required></label>
    <button class="primary" type="submit">Сохранить оклад</button>
  </form>
</section>

<section class="card">
  <h2>Начислить премию / надбавку</h2>
  <form id="bonus-form" class="inline">
    <label>Тип
      <select name="kind">
        <option value="bonus">Премия</option>
        <option value="allowance">Надбавка</option>
      </select>
    </label>
    <label>Сумма, ₽ <input name="amount" type="number" min="0.01" step="0.01" required></label>
    <label>Месяц <select name="month"></select></label>
    <label>Год <input name="year" type="number" min="2000" max="2100" required></label>
    <label style="flex:1;min-width:180px">Комментарий <input name="comment" maxlength="1000"></label>
    <button class="primary" type="submit">Добавить</button>
  </form>
  <div class="table-wrap" style="margin-top:16px">
    <table>
      <thead><tr><th>Период</th><th>Тип</th><th class="num">Сумма</th><th>Комментарий</th><th></th></tr></thead>
      <tbody data-bonuses></tbody>
    </table>
  </div>
</section>

<section class="card">
  <h2>Расчёт за месяц</h2>
  <form id="period-form" class="inline">
    <label>Месяц <select name="month"></select></label>
    <label>Год <input name="year" type="number" min="2000" max="2100" required></label>
    <button type="submit">Рассчитать</button>
  </form>
  <div class="stats" data-payslip style="margin-top:16px"></div>
</section>
